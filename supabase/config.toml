# Supabase CLI — CoteCerto
# Config mínima; campos ausentes usam defaults do CLI.
# Dev local: `supabase start` → API em http://127.0.0.1:54321
project_id = "cotecerto33"

[db]
port = 54322
major_version = 15

[api]
port = 54321
schemas = ["public"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/criar-senha",
  "http://localhost:3000/auth/redefinir-senha",
  "http://localhost:8080/auth/criar-senha",
  "http://localhost:8080/auth/redefinir-senha",
]
enable_signup = true

[auth.email]
otp_expiry = 172800
