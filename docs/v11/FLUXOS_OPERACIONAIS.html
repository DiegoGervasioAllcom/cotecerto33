<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluxos Operacionais · Supper Certo | Plataforma Cote Certo</title>
<style>
  :root{
    --slate:#425563; --slate-dark:#2F3D48; --yellow:#FFB600; --yellow-soft:#FFF6E0;
    --ink:#26313A; --muted:#7C8A95; --line:#E2E6E9; --bg:#F5F4F1; --white:#fff;
    --orange:#E8802A; --gray:#6B7A86; --gray-soft:#F2F3F4;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
  .top{background:var(--slate);color:#fff;padding:clamp(9px,1.4vh,15px) clamp(18px,2.4vw,30px);display:flex;align-items:center;gap:16px;flex:none}
  .logo{display:flex;flex-direction:column;line-height:1}
  .logo-img{height:clamp(26px,3.6vh,34px);width:auto;display:block}
  .logo .b{font-weight:800;font-size:20px;letter-spacing:.5px}
  .logo .b span{color:var(--yellow)}
  .logo .s{font-size:10px;letter-spacing:3px;color:#c7d0d6;margin-top:3px}
  .top .ttl{margin-left:8px;border-left:1px solid #5b6b77;padding-left:16px}
  .top .ttl h1{margin:0;font-size:clamp(14px,1.9vh,17px);font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .top .ttl .sub2{font-weight:400;font-size:clamp(11px,1.5vh,13px);color:#aebbc4}
  .top-spacer{flex:1}
  .menu{position:relative}
  .menu-btn{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:1.5px solid #5b6b77;color:#fff;padding:9px 16px;border-radius:999px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;transition:.15s}
  .menu-btn:hover{border-color:var(--yellow);background:rgba(255,255,255,.14)}
  .menu-btn .mk{font-size:10px;letter-spacing:1.5px;color:#9fb0ba;text-transform:uppercase;font-weight:800}
  .menu-btn .ml{font-weight:800}
  .menu-btn .chev{color:var(--yellow);font-size:12px;transition:transform .2s}
  .menu.open .menu-btn .chev{transform:rotate(180deg)}
  .menu-list{position:absolute;right:0;top:calc(100% + 8px);background:#fff;border-radius:14px;box-shadow:0 12px 34px rgba(30,40,50,.28);padding:8px;width:400px;z-index:40;opacity:0;visibility:hidden;transform:translateY(-6px);transition:.16s}
  .menu.open .menu-list{opacity:1;visibility:visible;transform:translateY(0)}
  .mi{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:none;background:none;padding:11px 12px;border-radius:10px;cursor:pointer;font-family:inherit;color:var(--ink);transition:.12s}
  .mi:hover{background:var(--bg)}
  .mi.on{background:var(--yellow-soft)}
  .mi .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--slate);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .mi.on .num{background:var(--yellow);color:var(--slate-dark)}
  .mi .mt{display:block;font-weight:700;font-size:13.5px;color:var(--slate);line-height:1.3}
  .mi .md{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}
  .pgtag{display:inline-block;font-size:12.1px;font-weight:800;letter-spacing:1.55px;text-transform:uppercase;color:var(--yellow);background:var(--slate);padding:5px 12px;border-radius:999px;margin-bottom:7px}
  .wrap{flex:1;min-height:0;width:100%;max-width:1800px;margin:0 auto;padding:clamp(8px,1.2vh,14px) clamp(16px,2.2vw,32px);display:flex}
  .card{flex:1;min-height:0;background:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(50,60,70,.10);overflow:hidden;display:flex;flex-direction:column}
  .scene-head{padding:clamp(12px,1.8vh,18px) clamp(18px,2.2vw,26px) clamp(4px,.8vh,8px);flex:none}
  .scene-head p{margin:clamp(2px,.5vh,5px) 0 0;color:var(--muted);font-size:clamp(13.5px,1.75vh,15.5px);font-weight:600}
  .stage{position:relative;flex:1;min-height:0;padding:clamp(2px,.6vh,8px) clamp(8px,1.2vw,16px);display:flex;align-items:center;justify-content:center;overflow:hidden}
  svg{width:100%;height:auto;max-height:100%;display:block;margin:auto}
  .node rect{transition:opacity .35s, transform .35s}
  .node .t{font-weight:700;fill:#fff;font-size:13.5px;letter-spacing:.2px}
  .node .s{fill:rgba(255,255,255,.88);font-size:10px;font-weight:500}
  .node.dim{opacity:.32}
  .node.on{opacity:1}
  .node.on rect{filter:drop-shadow(0 3px 10px rgba(0,0,0,.22))}
  .node rect{filter:drop-shadow(0 1.5px 3px rgba(40,50,60,.14))}
  .node.hero .t{font-size:18.5px;letter-spacing:.4px}
  /* linha única: TÍTULO negrito | qualificador sem negrito */
  .node.inline .t{font-size:16.5px;letter-spacing:.2px}
  .node .q{font-weight:400;fill:rgba(255,255,255,.86)}
  .node.k-rede .q{fill:rgba(47,61,72,.72)}
  .node.k-chip .q{fill:rgba(47,61,72,.72)}
  .node.hero .badge{fill:#fff}
  .node.hero .ico{stroke:var(--orange);stroke-width:2.1}
  .badge{fill:rgba(255,255,255,.22)}
  .ico{fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .node.k-rede .badge{fill:rgba(47,61,72,.16)}
  .node.k-rede .ico{stroke:var(--slate-dark)}
  .node.k-chip .badge{fill:rgba(47,61,72,.14)}
  .node.k-chip .ico{stroke:var(--slate-dark)}
  .node.soon rect{filter:none}
  .node.soon .badge{fill:#E4E8EA}
  .node.soon .ico{stroke:#93A0A9}
  .node.k-rede .t{fill:var(--slate-dark)}
  .node.k-rede .s{fill:#8A6400}
  .node.k-chip .t{fill:var(--slate-dark)}
  .node.k-chip .s{fill:#55606A}
  .node.soon .t{fill:#7C8A95}
  .node.soon .s{fill:#A2ACB4}
  /* caixa de opções (campo do formulário) */
  .node.lista rect{filter:drop-shadow(0 2px 5px rgba(40,50,60,.10))}
  .lista-t{font-size:11.5px;font-weight:800;letter-spacing:1.2px;fill:#8A96A0}
  .lista-i{font-size:13px;fill:var(--ink)}
  .lista-dot{fill:var(--yellow)}
  /* painel que reproduz o menu lateral do sistema */
  .panel-bg{fill:#3C4A54;filter:drop-shadow(0 6px 18px rgba(40,50,60,.22))}
  .panel-lb{fill:#8A99A5;font-size:11px;font-weight:800;letter-spacing:2.2px}
  .panel-it{fill:#DFE6EA;font-size:13px}
  .panel-it.sel{fill:#fff;font-weight:700}
  .panel-sel{fill:rgba(255,255,255,.09)}
  .panel-ic{fill:none;stroke:#AEBBC4;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .panel-cap{fill:#8A99A5;font-size:11px}
  .edge{fill:none;stroke:#CBD3D8;stroke-width:2;stroke-linecap:round;transition:.3s}
  .edge.on{stroke:var(--yellow);stroke-width:3.5}
  .zlabel{fill:#96A2AC;font-size:13.5px;font-weight:800;letter-spacing:1.3px}
  .token{fill:var(--yellow);stroke:#fff;stroke-width:2;opacity:0}
  .controls{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:clamp(9px,1.3vh,15px) clamp(18px,2.2vw,26px);border-top:1px solid var(--line)}
  .ctr-mid{display:flex;align-items:center;gap:16px}
  /* botões redondos padronizados (mesmo diâmetro) — 10% menores */
  .rbtn{width:43px;height:43px;border-radius:50%;border:1.5px solid var(--slate);background:#fff;color:var(--slate);font-size:21px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;transition:.15s}
  .rbtn:hover{background:#f4f6f8;transform:translateY(-1px)}
  .rbtn.primary{background:var(--yellow);border-color:var(--yellow);color:var(--slate-dark);box-shadow:0 3px 12px rgba(255,182,0,.36)}
  .rbtn.primary:hover{filter:brightness(.97)}
  .rbtn.ghost{border-color:var(--line);color:var(--muted);font-size:17px}
  .rbtn.ghost:hover{border-color:var(--slate);color:var(--slate)}
  .rbtn:disabled{opacity:.32;cursor:not-allowed;transform:none;box-shadow:none}
  .dots{display:flex;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
  .dot.on{background:var(--yellow);transform:scale(1.25)}
  .stepcount{font-size:12px;color:var(--muted);font-weight:700;min-width:56px}
  .cap{background:var(--yellow-soft);border-left:5px solid var(--yellow);margin:clamp(4px,.8vh,8px) clamp(16px,2vw,24px) clamp(8px,1.4vh,14px);padding:clamp(10px,1.4vh,14px) 18px;border-radius:0 12px 12px 0;overflow:hidden}
  .cap-body{will-change:clip-path,transform}
  .cap-body.slide{animation:capIn .5s cubic-bezier(.22,.7,.24,1)}
  @keyframes capIn{
    0%{clip-path:inset(0 100% 0 0);transform:translateX(-14px);opacity:.15}
    60%{opacity:1}
    100%{clip-path:inset(0 0 0 0);transform:translateX(0);opacity:1}
  }
  .cap .k{font-size:11px;font-weight:800;letter-spacing:1px;color:#8a6400;text-transform:uppercase}
  .cap h3{margin:3px 0 4px;color:var(--slate);font-size:16px}
  .cap p{margin:0;font-size:13.5px;color:var(--ink);line-height:1.5}
  .legend{display:flex;gap:clamp(10px,1.4vw,18px);flex-wrap:wrap;padding:0 clamp(18px,2.2vw,26px) clamp(2px,.6vh,8px);font-size:clamp(10.5px,1.35vh,12px);color:var(--muted);flex:none}
  .legend b{display:inline-flex;align-items:center;gap:6px;font-weight:600}
  .sw{width:11px;height:11px;border-radius:4px;display:inline-block}
  .foot{text-align:center;color:var(--muted);font-size:10px;padding:clamp(3px,.6vh,7px) 0;flex:none}
</style>
</head>

function iconFor(n){

}

/* ============ ENGINE ============ */
const svg = document.getElementById('svg');
const SVGNS='http://www.w3.org/2000/svg';
let curFlow='hierarquia', curStep=0;

function el(tag,attrs){ const e=document.createElementNS(SVGNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }
function nodeById(f,id){ return f.nodes.find(n=>n.id===id); }
function center(n){ return {x:n.x+n.w/2, y:n.y+n.h/2}; }
function anchor(from,to,route){
  const a=center(from), b=center(to); const dx=b.x-a.x, dy=b.y-a.y;
  if(route==='elbow'){
    const px=a.x, py=from.y+from.h, cx=b.x, ct=to.y;
    const bus=py+Math.min(22,(ct-py)/2);            // barramento único por PAI (irmãos compartilham → sem cruzar)
    if(Math.abs(cx-px)<1) return 'M '+px+' '+py+' L '+cx+' '+ct;   // filho reto abaixo
    const dir=cx>px?1:-1, r=Math.max(0,Math.min(12,Math.abs(cx-px)/2,bus-py,ct-bus));
    return 'M '+px+' '+py+
      ' L '+px+' '+(bus-r)+
      ' Q '+px+' '+bus+' '+(px+dir*r)+' '+bus+
      ' L '+(cx-dir*r)+' '+bus+
      ' Q '+cx+' '+bus+' '+cx+' '+(bus+r)+
      ' L '+cx+' '+ct;
  }
  if(route==='helbow'){ /* conector horizontal com dobras retas arredondadas */
    const px=from.x+from.w, py=a.y, cx=to.x, cy=b.y;
    if(Math.abs(cy-py)<1) return 'M '+px+' '+py+' L '+cx+' '+cy;
    const mid=px+(cx-px)/2, dir=cy>py?1:-1;
    const r=Math.max(0,Math.min(12,Math.abs(cy-py)/2,Math.abs(mid-px),Math.abs(cx-mid)));
    return 'M '+px+' '+py+' L '+(mid-r)+' '+py+' Q '+mid+' '+py+' '+mid+' '+(py+dir*r)
         +' L '+mid+' '+(cy-dir*r)+' Q '+mid+' '+cy+' '+(mid+r)+' '+cy+' L '+cx+' '+cy;
  }
  if(route==='uelbow'){ /* retorno: sobe, atravessa e entra por baixo do destino */
    const px=a.x, py=from.y, cx=b.x, cy=to.y+to.h;
    const bus=py-Math.min(24,(py-cy)/2);
    if(Math.abs(cx-px)<1) return 'M '+px+' '+py+' L '+cx+' '+cy;
    const dir=cx>px?1:-1, r=Math.max(0,Math.min(12,Math.abs(cx-px)/2,py-bus,bus-cy));
    return 'M '+px+' '+py+' L '+px+' '+(bus+r)+' Q '+px+' '+bus+' '+(px+dir*r)+' '+bus
         +' L '+(cx-dir*r)+' '+bus+' Q '+cx+' '+bus+' '+cx+' '+(bus-r)+' L '+cx+' '+cy;
  }
  if(route==='crossD'){ /* Full DEVOLVIDO → Matriz DEVOLVIDO, sobe pelo corredor à direita */
    return 'M 1079 616 L 1088 616 Q 1100 616 1100 604 L 1100 296 Q 1100 284 1088 284 L 1079 284'; }
  if(route==='crossP'){ /* Full PERDA → Matriz PERDA, sobe pelo corredor à esquerda */
    return 'M 642 616 L 630 616 Q 618 616 618 604 L 618 296 Q 618 284 630 284 L 642 284'; }
  if(route==='v'){ return 'M '+a.x+' '+(from.y+from.h)+' L '+b.x+' '+to.y; }
  if(route==='h'){ return 'M '+(from.x+(dx>=0?from.w:0))+' '+a.y+' L '+(to.x+(dx>=0?0:to.w))+' '+b.y; }
  let p1,p2;
  if(Math.abs(dx)>=Math.abs(dy)){ p1={x: from.x+(dx>0?from.w:0), y:a.y}; p2={x: to.x+(dx>0?0:to.w), y:b.y}; }
  else { p1={x:a.x, y: from.y+(dy>0?from.h:0)}; p2={x:b.x, y: to.y+(dy>0?0:to.h)}; }
  return 'M '+p1.x+' '+p1.y+' L '+p2.x+' '+p2.y;
}

/* um fluxo pode ter mais de uma CENA; cada elemento traz sc (0 = padrão) */
let curScene=-1;
const inScene=(o,sc)=>((o.sc||0)===sc);
function drawFlow(fid,sc){
  const f=FLOWS[fid]; sc=sc||0; curScene=sc;
  svg.setAttribute('viewBox', (f.scenes? f.scenes[sc].vb : f.vb) || '0 0 860 460');
  svg.innerHTML='';
  (f.zones||[]).filter(z=>inScene(z,sc)).forEach(z=>{
    svg.appendChild(el('rect',{x:z.x,y:z.y,width:z.w,height:z.h,rx:18,fill:z.color,stroke:z.stroke,'stroke-width':1.2}));
    /* rótulo FORA da área, centralizado — abaixo (padrão) ou acima (lp:'top') */
    const gap = z.ldy||13; /* distância do rótulo até a área */
    const ly = (z.lp==='top') ? z.y-gap : z.y+z.h+10+gap;
    /* rótulo centralizado sobre a área (la:'left'/'right' e lx ajustam casos pontuais) */
    const anc = z.la==='right' ? 'end' : (z.la==='left' ? 'start' : 'middle');
    const lx  = (z.lx!==undefined) ? z.lx
              : (anc==='end' ? z.x+z.w-4 : anc==='start' ? z.x+4 : z.x+z.w/2);
    const tx=el('text',{x:lx,y:ly,'text-anchor':anc,class:'zlabel',fill:z.lc});
    tx.textContent=z.label; svg.appendChild(tx);
  });
  /* camada própria p/ as linhas: permite trazer a linha ativa à frente das cinzas */
  const gEdges=el('g',{id:'gEdges'}); svg.appendChild(gEdges);
  svg.appendChild(el('g',{id:'gDyn'})); /* conectores que mudam a cada passo */
  f.edges.filter(e=>inScene(e,sc)).forEach(e=>{
    const A=nodeById(f,e.from), B=nodeById(f,e.to);
    gEdges.appendChild(el('path',{id:'edge_'+e.id,class:'edge',d:anchor(A,B,e.route)}));
  });
  f.nodes.filter(n=>inScene(n,sc)).forEach(n=>{
    if(n.lista){ /* caixa com opções de um campo do formulário */
      const g=el('g',{id:'node_'+n.id,class:'node dim lista'});
      g.appendChild(el('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:14,fill:'#fff',stroke:'#D8DEE2','stroke-width':1.5}));
      const tt=el('text',{x:n.x+20,y:n.y+27,class:'lista-t'}); tt.textContent=n.t; g.appendChild(tt);
      (n.itens||[]).forEach((it,i)=>{
        const y=n.y+52+i*26;
        g.appendChild(el('circle',{cx:n.x+26,cy:y-4,r:3.2,class:'lista-dot'}));
        const li=el('text',{x:n.x+40,y:y,class:'lista-i'}); li.textContent=it; g.appendChild(li);
      });
      svg.appendChild(g); return;
    }
    if(n.panel){ /* painel: reproduz o menu lateral do sistema */
      const g=el('g',{id:'node_'+n.id,class:'panel'});
      g.appendChild(el('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:16,class:'panel-bg'}));
      g.appendChild(el('g',{id:'panelItems'}));
      svg.appendChild(g); return;
    }
    const g=el('g',{id:'node_'+n.id,class:'node dim k-'+(n.k||'x')+(n.soon?' soon':'')+(n.hero?' hero':'')});
    if(n.soon){ g.appendChild(el('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:12,fill:'#F2F3F4',stroke:'#CFD6DB','stroke-width':1.5,'stroke-dasharray':'5 3'})); }
    else { g.appendChild(el('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:12,fill:KIND[n.k]||'#555'})); }
    /* ícone + textos formam um bloco centralizado na caixa */
    const ipath=iconFor(n), cy=n.y+n.h/2;
    const R=n.hero?17:13.5, SC=(n.hero?21:17)/24, GAP=n.hero?2*17+16:37;
    let badge=null, ico=null;
    if(ipath){
      badge=el('circle',{class:'badge',r:R,cx:n.x+25,cy:cy});
      ico=el('path',{class:'ico',d:ipath});
      g.appendChild(badge); g.appendChild(ico);
    }
    /* inline: uma linha só — TÍTULO em negrito | qualificador sem negrito */
    const t=el('text',{x:n.x,y:n.y+(n.inline? n.h/2+6 : (n.s? n.h/2-2 : n.h/2+4.5)),'text-anchor':'start',class:'t'});
    if(n.inline){
      const b=el('tspan',{}); b.textContent=n.t; t.appendChild(b);
      if(n.s){ const q=el('tspan',{class:'q'}); q.textContent=' | '+n.s; t.appendChild(q); }
    } else t.textContent=n.t;
    g.appendChild(t);
    let s=null;
    if(n.s&&!n.inline){ s=el('text',{x:n.x,y:cy+12,'text-anchor':'start',class:'s'}); s.textContent=n.s; g.appendChild(s); }
    svg.appendChild(g);
    /* centraliza: mede o texto de verdade quando possível */
    let tw=n.inline ? estW(n.t+(n.s?' | '+n.s:''),16.5)
                    : Math.max(estW(n.t,n.hero?18.5:13.5), n.s?estW(n.s,10):0);
    try{ const a=t.getBBox().width, b=s?s.getBBox().width:0; if(a>0) tw=Math.max(a,b); }catch(e){}
    const gap=ipath?GAP:0, sx=n.x+(n.w-(gap+tw))/2;
    if(badge){
      const bcx=sx+R;
      badge.setAttribute('cx',bcx);
      ico.setAttribute('transform','translate('+(bcx-12*SC)+','+(cy-12*SC)+') scale('+SC+')');
    }
    t.setAttribute('x',sx+gap);
    if(s) s.setAttribute('x',sx+gap);
  });
  const tok=el('circle',{id:'token',class:'token',r:7,cx:0,cy:0}); svg.appendChild(tok);
}

let rafId=null;
function animateToken(fid, edgeId){
  const path=document.getElementById('edge_'+edgeId); const tok=document.getElementById('token');
  if(!path||!tok){ return; }
  if(rafId) cancelAnimationFrame(rafId);
  const len=path.getTotalLength(); const dur=850; const t0=performance.now();
  tok.setAttribute('opacity','1');
  function frame(now){
    let k=Math.min(1,(now-t0)/dur); const e=1-Math.pow(1-k,2); // easeOut
    const pt=path.getPointAtLength(e*len);
    tok.setAttribute('cx',pt.x); tok.setAttribute('cy',pt.y);
    if(k<1){ rafId=requestAnimationFrame(frame); } else { setTimeout(()=>tok.setAttribute('opacity','0'),250); }
  }
  rafId=requestAnimationFrame(frame);
}

/* desenha o menu do perfil dentro do painel + o conector do perfil ativo */
function renderPanel(f,st){
  const pn=f.nodes.find(n=>n.panel); if(!pn) return;
  const box=document.getElementById('panelItems'); if(!box) return;
  const gD=document.getElementById('gDyn'); if(gD) gD.innerHTML='';
  box.innerHTML='';
  const M=MENUS[st.menu];
  if(!M){ /* estado neutro: ainda não há perfil selecionado */
    const l1=el('text',{x:pn.x+26,y:pn.y+34,class:'panel-lb'}); l1.textContent='MENU DO PERFIL'; box.appendChild(l1);
    const l2=el('text',{x:pn.x+26,y:pn.y+66,class:'panel-cap'});
    l2.textContent='avance para ver o que cada perfil enxerga'; box.appendChild(l2);
    return;
  }
  const lb=el('text',{x:pn.x+26,y:pn.y+34,class:'panel-lb'}); lb.textContent=M.titulo; box.appendChild(lb);
  M.itens.forEach((it,i)=>{
    const y=pn.y+60+i*23, ativo=(i===0);
    if(ativo) box.appendChild(el('rect',{x:pn.x+14,y:y-15,width:pn.w-28,height:23,rx:7,class:'panel-sel'}));
    const ic=ICONS[MENU_IC[it]||'doc'], sc2=15/24;
    box.appendChild(el('path',{class:'panel-ic',d:ic,
      transform:'translate('+(pn.x+26-12*sc2)+','+(y-4-12*sc2)+') scale('+sc2+')'}));
    const t=el('text',{x:pn.x+48,y:y,class:'panel-it'+(ativo?' sel':'')}); t.textContent=it; box.appendChild(t);
  });
  const rod=el('text',{x:pn.x+26,y:pn.y+pn.h-16,class:'panel-cap'});
  rod.textContent=(M.nota? M.nota+' · ' : '')+M.itens.length+' áreas visíveis';
  box.appendChild(rod);
  /* conectores do passo: origem → perfil → painel */
  const perfil=f.nodes.find(n=>n.id===(st.on||[])[0]);
  if(perfil&&gD){
    if(st.src){ const o=f.nodes.find(n=>n.id===st.src);
      if(o) gD.appendChild(el('path',{id:'edge_origem',class:'edge on',d:anchor(o,perfil,'helbow')})); }
    gD.appendChild(el('path',{id:'edge_painel',class:'edge on',d:anchor(perfil,pn,'helbow')}));
  }
}

function renderStep(){
  const f=FLOWS[curFlow]; const st=f.steps[curStep]; const sc=st.sc||0;
  if(sc!==curScene) drawFlow(curFlow, sc); /* troca de cena dentro do mesmo fluxo */
  f.nodes.filter(n=>inScene(n,sc)).forEach(n=>{ const g=document.getElementById('node_'+n.id); if(!g)return;
    g.classList.toggle('on', st.on.includes(n.id)); g.classList.toggle('dim', !st.on.includes(n.id)); });
  const gE=document.getElementById('gEdges');
  f.edges.filter(e=>inScene(e,sc)).forEach(e=>{
    const p=document.getElementById('edge_'+e.id); if(!p)return;
    const on=(st.eon||[]).includes(e.id);
    p.classList.toggle('on', on);
    if(on && gE) gE.appendChild(p); /* reposiciona no fim: fica por cima das cinzas */
  });
  if(f.nodes.some(n=>n.panel)) renderPanel(f,st);
  document.getElementById('capK').textContent='Passo '+(curStep+1);
  document.getElementById('capT').textContent=st.t;
  document.getElementById('capB').textContent=st.b;
  // reanima a explicação deslizando de dentro da linha amarela
  const cb=document.getElementById('capBody'); cb.classList.remove('slide'); void cb.offsetWidth; cb.classList.add('slide');
  document.getElementById('cnt').textContent=(curStep+1)+' de '+f.steps.length;
  document.getElementById('prev').disabled=(curStep===0);
  document.getElementById('next').disabled=(curStep===f.steps.length-1);
  // dots
  const dots=document.getElementById('dots'); dots.innerHTML='';
  f.steps.forEach((s,i)=>{ const d=document.createElement('div'); d.className='dot'+(i===curStep?' on':''); d.onclick=()=>{curStep=i;renderStep();}; dots.appendChild(d); });
  if(st.travel){ setTimeout(()=>animateToken(curFlow, st.travel), 120); }
}

const FLOW_IDS=Object.keys(FLOWS);
function selectFlow(fid){
  curFlow=fid; curStep=0;
  const f=FLOWS[fid]; const idx=FLOW_IDS.indexOf(fid);
  document.getElementById('menuLabel').textContent=f.tab;
  document.getElementById('pgTag').textContent=f.tab;
  document.querySelectorAll('.mi').forEach(t=>t.classList.toggle('on', t.dataset.f===fid));
  document.getElementById('scSub').textContent=f.sub;
  closeMenu();
  drawFlow(fid, (f.steps[0].sc||0)); renderStep();
}

/* menu suspenso de fluxos */
const menuEl=document.getElementById('menu');
const menuBtn=document.getElementById('menuBtn');
const menuList=document.getElementById('menuList');
function openMenu(){ menuEl.classList.add('open'); menuBtn.setAttribute('aria-expanded','true'); }
function closeMenu(){ menuEl.classList.remove('open'); menuBtn.setAttribute('aria-expanded','false'); }
FLOW_IDS.forEach((fid,i)=>{
  const b=document.createElement('button'); b.className='mi'; b.dataset.f=fid; b.setAttribute('role','menuitem');
  b.innerHTML='<span class="num">'+(i+1)+'</span><span><span class="mt">'+FLOWS[fid].tab+'</span><span class="md">'+FLOWS[fid].sub+'</span></span>';
  b.onclick=()=>selectFlow(fid); menuList.appendChild(b);
});
menuBtn.onclick=(e)=>{ e.stopPropagation(); menuEl.classList.contains('open')?closeMenu():openMenu(); };
document.addEventListener('click',(e)=>{ if(!menuEl.contains(e.target)) closeMenu(); });

document.getElementById('next').onclick=()=>{ const f=FLOWS[curFlow]; if(curStep<f.steps.length-1){curStep++;renderStep();} };
document.getElementById('prev').onclick=()=>{ if(curStep>0){curStep--;renderStep();} };
document.getElementById('replay').onclick=()=>{ curStep=0; renderStep(); };
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight')document.getElementById('next').click(); if(e.key==='ArrowLeft')document.getElementById('prev').click(); if(e.key==='Escape')closeMenu(); });

selectFlow('hierarquia');
</script>
